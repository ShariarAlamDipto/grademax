# nginx site for www.grademax.me -> the grademax Docker container.
#
# Cloudflare sits in front; this server only talks to Cloudflare. Each block
# below exists because its default caused, or can cause, a Cloudflare 502/504.
# This is a REFERENCE file. Do not replace the live site file with it: the live
# file has its own listen/ssl (Cloudflare origin certificate) lines. Copy the
# directives marked below into the existing server/location block, then:
#           sudo nginx -t && sudo systemctl reload nginx
# Nginx Proxy Manager: paste the same directives into the proxy host's
# Advanced -> Custom Nginx Configuration box.

upstream grademax_app {
    server 127.0.0.1:3004;   # GRADEMAX_PORT in docker.env
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name grademax.me www.grademax.me;

    # Request headers. A signed-in browser sends the Supabase session cookie
    # (~5 KB, two chunks) plus AdSense/analytics cookies on every request. The
    # default 4 x 8k rejects that with "400 Request Header Or Cookie Too Large".
    large_client_header_buffers 4 32k;

    # Teachers upload lecture files through the app.
    client_max_body_size 50m;

    location / {
        proxy_pass http://grademax_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # The app builds sign-in redirects from these (src/lib/safeRedirect.ts).
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        # Response headers. THE sign-in 502: a successful sign-in, and the
        # hourly token refresh on /dashboard, /generate etc., sends ~5 KB of
        # Set-Cookie plus ~3 KB of other headers. The default buffer is one
        # memory page (4k), so nginx logged "upstream sent too big header" and
        # returned 502. 16k leaves room for a third cookie chunk.
        proxy_buffer_size       16k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;

        # Worksheet / test PDFs are assembled per request. Cloudflare gives up
        # at 100 s (error 524), so waiting longer than that here is pointless.
        proxy_connect_timeout 5s;
        proxy_send_timeout    100s;
        proxy_read_timeout    100s;

        # While the container restarts (deploy, crash), show a page that retries
        # by itself instead of Cloudflare's "Bad gateway".
        proxy_intercept_errors off;
        error_page 502 504 = @restarting;
    }

    location @restarting {
        default_type text/html;
        add_header Retry-After 15 always;
        add_header Cache-Control "no-store" always;
        return 503 '<!doctype html><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="15"><title>GradeMax is restarting</title>
<body style="font-family:sans-serif;text-align:center;margin-top:20vh">
<h1>GradeMax is restarting</h1>
<p>We are updating the site. This page reloads itself in 15 seconds.</p>
</body>';
    }
}
